[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Broad catches are intentional at plugin/process boundaries: the host must stay alive,
# while every user-facing message is passed through safe_error/redact_text.
ignore = ["BLE001", "S112", "TRY203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
